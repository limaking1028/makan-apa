<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>今天吃啥 Makan Apa</title>
<meta name="description" content="存下你常去的店，按時段、主食、預算快速找到今天要去哪一家。">
<meta name="theme-color" content="#EAF1EC">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: one phone-width column. A first-run screen asks for the places the person already eats at; afterwards the saved list leads. */
:root{
  --bg:#EAF1EC;
  --surface:#F7FAF7;
  --ink:#12301F;
  --ink-2:#4A6354;
  --line:#C5D4C9;
  --rule:#12301F;
  --tile:#DCE7DF;
  --accent:#C93418;
  --on-accent:#FFFFFF;
  --focus:#1F7A4D;
  --font-display:"Bricolage Grotesque","Noto Sans TC",system-ui,sans-serif;
  --font-body:"Noto Sans TC","Bricolage Grotesque",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1913;--surface:#15251B;--ink:#E4EFE7;--ink-2:#9AB1A1;--line:#2B4034;--rule:#3E5B4A;--tile:#1B2D22;
    --accent:#F0553A;--on-accent:#1A0B06;--focus:#6FD3A0;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1913;--surface:#15251B;--ink:#E4EFE7;--ink-2:#9AB1A1;--line:#2B4034;--rule:#3E5B4A;--tile:#1B2D22;
  --accent:#F0553A;--on-accent:#1A0B06;--focus:#6FD3A0;color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.app{
  max-width:520px;margin:0 auto;padding-block:18px 44px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px;
}
.brand{margin:0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand-main{font-family:var(--font-display);font-size:26px;font-weight:800;letter-spacing:-.015em;line-height:1.1}
.brand-sub{font-family:var(--font-display);font-size:14px;font-weight:600;color:var(--ink-2)}

.intro{margin:0;max-width:46ch}
.intro strong{font-size:20px;font-weight:900;display:block;margin-bottom:4px;line-height:1.3}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  min-height:40px;padding:0 14px;border:1.5px solid var(--line);border-radius:8px;
  background:transparent;font-size:14px;font-weight:500;line-height:1.2;
}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip-dish{background:var(--tile);border-color:var(--tile)}
@media (hover:hover){.chip:hover{border-color:var(--ink-2)}.chip[aria-pressed="true"]:hover{border-color:var(--ink)}}

.panel{background:var(--surface);border:1.5px solid var(--rule);border-radius:14px;padding:18px;min-width:0}
.form{display:flex;flex-direction:column;gap:20px}
.step{display:flex;flex-direction:column;gap:8px;min-width:0}
.step-label{display:flex;align-items:baseline;gap:8px;font-size:15px;font-weight:700}
.step-num{font-family:var(--font-display);font-size:13px;font-weight:800;color:var(--on-accent);background:var(--accent);border-radius:50%;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.hint{font-size:12.5px;font-weight:400;color:var(--ink-2)}
.sub{margin:0;font-size:12.5px;color:var(--ink-2)}
.input{width:100%;min-height:46px;padding:0 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.row{display:flex;gap:8px}
.row .input{flex:1;min-width:0}
.err{margin:0;color:var(--accent);font-size:13.5px;font-weight:500}
.err:empty{display:none}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 16px;
  border-radius:10px;font-size:16px;font-weight:700;line-height:1.2;text-align:center;
  border:2px solid var(--ink);background:transparent;color:var(--ink);
}
.btn-main{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-sm{min-height:46px;font-size:14px;padding:0 14px;flex:none}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions.one{grid-template-columns:1fr}
.link{
  display:inline-flex;align-items:center;min-height:40px;padding:0;background:none;border:none;
  font-size:14px;font-weight:500;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--ink-2);
}

.list-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-top:1.5px solid var(--rule);padding-top:14px;font-size:13px;font-weight:700;letter-spacing:.06em}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.place{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.place-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.place-body .place-main{flex:none;width:100%}
.addr{display:inline-block;align-self:flex-start;min-height:34px;padding:6px 0;font-size:13px;color:var(--accent);text-decoration:underline;overflow-wrap:anywhere}
.brs{margin:0}.brs summary{cursor:pointer;min-height:34px;padding:6px 0;font-size:13px;color:var(--accent)}
.brs .addr{display:block}
.br{display:flex;flex-direction:column;gap:6px;padding:8px 0;border-top:1px solid var(--line)}
.br:first-child{border-top:none;padding-top:0}
.br-top{display:flex;gap:6px}
.br-top .input{flex:1;min-width:0}
.near-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.near-row .sub{flex:1;min-width:160px}
.mappick{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.place-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left;background:none;border:none;padding:0;min-height:44px}
@media (hover:hover){.place-main:hover .place-name{text-decoration:underline;text-underline-offset:3px}}
.place-name{font-size:18px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.place-meta{font-size:13px;color:var(--ink-2)}
.place-dishes{font-size:14px;overflow-wrap:anywhere}
.del{flex:none;min-width:44px;min-height:44px;border:1.5px solid var(--line);border-radius:8px;background:transparent;font-size:18px;line-height:1}
.del.sure{color:var(--accent);border-color:var(--accent);font-size:13px;font-weight:700;padding:0 10px}
.saved{margin:0;padding:8px 12px;border:2px solid var(--accent);border-radius:8px;color:var(--accent);font-weight:700;font-size:14px;align-self:flex-start;transform:rotate(-1.5deg)}
.btn-ghost{border-color:var(--line)}
.search{display:flex;flex-direction:column;gap:12px}
.search-row{display:flex;gap:8px}
.search-row .input{flex:1;min-width:0}
.fgroups{display:flex;flex-direction:column;gap:14px;padding:14px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px}
.fgroup{display:flex;flex-direction:column;gap:8px}
.fl{font-size:13px;font-weight:500;color:var(--ink-2)}
.place-acts{display:flex;gap:6px;flex:none}
.edit{min-height:44px;padding:0 12px;border:1.5px solid var(--line);border-radius:8px;background:transparent;font-size:14px;font-weight:500}
.empty{padding:16px 0;color:var(--ink-2);list-style:none}
.form-title{font-size:18px;font-weight:900}
.backup{border-top:1.5px solid var(--rule);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.ta{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:13px;word-break:break-all;resize:vertical}
.namerow{display:flex;gap:10px;align-items:flex-start}
.namerow .input{flex:1;min-width:0}
#photoSlot{display:flex;flex-direction:column;align-items:center;gap:0;flex:none}
.photo{width:76px;height:76px;border:1.5px dashed var(--ink-2);border-radius:10px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--ink-2);overflow:hidden;padding:0}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.thumb{width:60px;height:60px;border-radius:8px;flex:none;background:var(--tile);overflow:hidden;display:flex;align-items:center;justify-content:center;border:none;padding:0;color:var(--ink-2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.ic{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.timerow{display:flex;gap:12px}
.tpick{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;align-items:center}
.tl-label{font-size:13px;font-weight:500;color:var(--ink-2)}
.wheels{position:relative;display:flex;align-items:center;gap:2px;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:0 6px}
.wheel{height:120px;width:56px;overflow-y:auto;scroll-snap-type:y mandatory;padding-block:40px;scrollbar-width:none;overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.wheel::-webkit-scrollbar{display:none}
.wheel:focus-visible{outline-offset:-2px}
.wi{height:40px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;font-family:var(--font-display);font-size:22px;font-variant-numeric:tabular-nums;color:var(--ink-2);cursor:pointer;opacity:.65;user-select:none;-webkit-user-select:none}
.wi.sel{color:var(--ink);font-weight:700;opacity:1}
.colon{font-size:22px;font-weight:700}
.wband{position:absolute;left:4px;right:4px;top:40px;height:40px;border-top:1.5px solid var(--ink-2);border-bottom:1.5px solid var(--ink-2);pointer-events:none}
.tl{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2)}
.open-tag{color:var(--focus);font-weight:700}
.closed-tag{color:var(--ink-2)}
.foods{display:flex;flex-wrap:wrap;gap:8px}
.fthumb{position:relative;width:72px;height:72px;border-radius:10px;overflow:hidden;background:var(--tile)}
.fthumb img{width:100%;height:100%;object-fit:cover;display:block}
.fx{position:absolute;top:3px;right:3px;width:30px;height:30px;border-radius:50%;border:none;background:rgba(0,0,0,.62);color:#fff;font-size:17px;line-height:1;padding:0}
.fadd{width:72px;height:72px;border:1.5px dashed var(--ink-2);border-radius:10px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--ink-2);padding:0}
.foodrow{display:flex;gap:6px;margin-top:6px}
.foodrow img{width:44px;height:44px;border-radius:6px;object-fit:cover;display:block}
.note{margin:0;font-size:12.5px;color:var(--ink-2);max-width:56ch}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 class="brand"><span class="brand-main">今天吃啥</span><span class="brand-sub">Makan Apa?</span></h1>
  </header>
  <main id="main" style="display:flex;flex-direction:column;gap:18px"></main>
  <div id="backup"></div>
  <p class="note">店的資料只存在這支手機的瀏覽器裡，清除瀏覽資料或換手機就會不見。</p>
</div>

<script>
(function(){
'use strict';

var KINDS=['rice','noodle','bread','soup','snack','other'];
var KIND_ZH={rice:'飯',noodle:'麵粉',bread:'餅·麵包',soup:'湯·粥',snack:'小吃·甜點',other:'其他'};
var CUISINES=['malay','chinese','hk','indian','thai','japanese','korean','western','viet','other'];
var CUISINE_ZH={malay:'馬來·印尼',chinese:'華人',hk:'港式',indian:'印度·嘛嘛',thai:'泰式',japanese:'日式',korean:'韓式',western:'西式',viet:'越南',other:'其他'};
var MEALS=['b','l','t','d','s'];
var MEAL_ZH={b:'早餐',l:'午餐',t:'下午茶',d:'晚餐',s:'宵夜'};
var BUDGETS=['low','mid','high'];
var BUDGET_ZH={low:'RM10 內',mid:'RM10–20',high:'RM20 以上'};
var MAX_PLACES=60, MAX_DISHES=12, MAX_BRANCHES=10;
var KEY='makan-apa-places-v2', MAPKEY='makan-apa-map-v1';
var MAPS=['google','waze','apple'], MAP_ZH={google:'Google 地圖',waze:'Waze',apple:'Apple 地圖'};
function cleanAddr(a){return typeof a==='string'?a.replace(/\s+/g,' ').trim().slice(0,120):'';}
function mapUrl(a){var q=encodeURIComponent(a);return S.map==='waze'?'https://waze.com/ul?q='+q+'&navigate=yes':S.map==='apple'?'https://maps.apple.com/?q='+q:'https://www.google.com/maps/search/?api=1&query='+q;}
function loadMap(){var m='google';try{m=localStorage.getItem(MAPKEY)||'google';}catch(e){}return MAPS.indexOf(m)>-1?m:'google';}
function mapPickHtml(){return '<div class="fl">點地址用哪個地圖開啟</div><div class="chips">'+MAPS.map(function(k){return chip('data-map',k,MAP_ZH[k],S.map===k);}).join('')+'</div>';}
function cleanBranches(p){var src=Array.isArray(p.branches)?p.branches:(typeof p.address==='string'&&p.address.trim()?[{name:'',address:p.address}]:[]),out=[];src.forEach(function(b){var a,o;if(!b||typeof b!=='object')return;a=cleanAddr(b.address);if(a){o={name:cleanAddr(b.name).slice(0,30),address:a};if(typeof b.lat==='number'&&typeof b.lng==='number'&&isFinite(b.lat)&&isFinite(b.lng)&&Math.abs(b.lat)<=90&&Math.abs(b.lng)<=180){o.lat=Math.round(b.lat*1e5)/1e5;o.lng=Math.round(b.lng*1e5)/1e5;}else if(b.nf===true) o.nf=true;out.push(o);}});return out.slice(0,MAX_BRANCHES);}
function brForm(p){var b=cleanBranches(p).map(function(x){return JSON.parse(JSON.stringify(x));});return b.length?b:[{name:'',address:''}];}
function brAreaHtml(){var F=S.form,h=F.branches.map(function(b,i){return '<div class="br"><div class="br-top"><input class="input" data-bi="'+i+'" data-bf="name" maxlength="30" autocomplete="off" aria-label="分店名" placeholder="'+(i?'分店名，例如：Bangsar':'分店名（選填），例如：SS2')+'" value="'+esc(b.name)+'">'+(F.branches.length>1?'<button type="button" class="del" data-rmbr="'+i+'" aria-label="刪除這個地址">×</button>':'')+'</div><input class="input" data-bi="'+i+'" data-bf="address" maxlength="120" autocomplete="off" aria-label="地址" placeholder="地址，例如：12 Jalan SS2/24, Petaling Jaya" value="'+esc(b.address)+'"></div>';}).join('');if(F.branches.length<MAX_BRANCHES) h+='<button type="button" class="btn btn-sm btn-ghost" data-act="addbranch">+ 加分店</button>';return h;}
function hav(a,b,c,d){var r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,h=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)*Math.sin(y/2);return 12742*Math.asin(Math.sqrt(h));}
function brDist(b){return (S.near&&typeof b.lat==='number'&&typeof b.lng==='number')?hav(S.near.lat,S.near.lng,b.lat,b.lng):null;}
function placeDist(p){var m=null;(p.branches||[]).forEach(function(b){var d=brDist(b);if(d!==null&&(m===null||d<m)) m=d;});return m;}
function fmtDist(d){return d<1?'直線約 '+(Math.max(1,Math.round(d*100))*10)+' 公尺':'直線約 '+(d<10?d.toFixed(1):Math.round(d))+' 公里';}
function hasAddr(p){return !!(p.branches&&p.branches.length);}
function nearUi(){var b=$('nearBtn'),m=$('nearMsg');if(!b) return;b.textContent=S.nearBusy?'處理中…':(S.near?'✕ 取消距離排序':'📍 離我最近');b.disabled=!!S.nearBusy;m.textContent=S.nearMsg||'';}
function nearSet(msg){S.nearMsg=msg||'';nearUi();}
function geocodeOne(addr,pos,cb){
  var parts=addr.split(/\s*,\s*/), tries=[addr], k=0;
  if(parts.length>2) tries.push(parts.slice(1).join(', '));
  if(parts.length>3) tries.push(parts.slice(2).join(', '));
  function go(){
    var q=tries[k], ctl=window.AbortController?new AbortController():null, t=setTimeout(function(){if(ctl) ctl.abort();},10000),
    url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q='+encodeURIComponent(q)+'&viewbox='+[pos.lng-1,pos.lat+1,pos.lng+1,pos.lat-1].join(',')+'&bounded=0';
    fetch(url,ctl?{signal:ctl.signal}:{}).then(function(r){if(!r.ok) throw 0;return r.json();}).then(function(a){
      var x=a&&a[0], la=x&&parseFloat(x.lat), lo=x&&parseFloat(x.lon);
      clearTimeout(t);
      if(isFinite(la)&&isFinite(lo)) return cb({lat:la,lng:lo});
      k++; if(k<tries.length) setTimeout(go,1100); else cb(null);
    }).catch(function(){clearTimeout(t);cb('err');});
  }
  go();
}
function geoNext(q,k,pos,st){
  var it;
  if(k>=q.length){
    S.nearBusy=false;
    var any=S.places.some(function(p){return (p.branches||[]).some(function(b){return typeof b.lat==='number';});}), miss=0;
    S.places.forEach(function(p){(p.branches||[]).forEach(function(b){if(typeof b.lat!=='number') miss++;});});
    if(!any){S.nearMsg='找不到這些地址的位置。地址寫得越完整（含城市）越準。';nearUi();return;}
    S.near=pos; S.nearMsg=miss?miss+' 個地址找不到位置，沒有排進距離。距離是直線距離，只供參考。':'距離是直線距離，只供參考。';
    if($('listArea')) refreshList(); else nearUi();
    return;
  }
  it=q[k]; nearSet('查地址位置 '+(k+1)+' / '+q.length+'…（地址會送到 OpenStreetMap 查詢，每個只查一次）');
  geocodeOne(it.address,pos,function(res){
    var p=null,b;
    S.places.forEach(function(x){if(x.id===it.pid) p=x;});
    b=p&&p.branches&&p.branches[it.i];
    if(res==='err'){
      st.net++;
      if(st.net>=2){save();S.nearBusy=false;nearSet('連不上地圖服務，請檢查網路後再試。');return;}
    }else if(b&&b.address===it.address){
      if(res){b.lat=Math.round(res.lat*1e5)/1e5;b.lng=Math.round(res.lng*1e5)/1e5;delete b.nf;}else b.nf=true;
    }
    save();
    if(k+1<q.length) setTimeout(function(){geoNext(q,k+1,pos,st);},1100); else geoNext(q,k+1,pos,st);
  });
}
function startNearest(){
  if(S.near){S.near=null;S.nearMsg='';refreshList();return;}
  if(!S.places.some(hasAddr)){nearSet('還沒有店存了地址。請先編輯店，填上地址。');return;}
  if(!navigator.geolocation){nearSet('這個瀏覽器不能取得位置。');return;}
  S.nearBusy=true; nearSet('正在取得你的位置…');
  navigator.geolocation.getCurrentPosition(function(pos){
    var q=[], here={lat:pos.coords.latitude,lng:pos.coords.longitude};
    S.places.forEach(function(p){(p.branches||[]).forEach(function(b,i){if(typeof b.lat!=='number'&&!b.nf) q.push({pid:p.id,i:i,address:b.address});});});
    geoNext(q,0,here,{net:0});
  },function(err){
    S.nearBusy=false;
    nearSet(err&&err.code===1?'沒有位置權限。請在瀏覽器設定允許這個網站使用位置，再試一次。':'取得不到你的位置，請稍後再試。');
  },{enableHighAccuracy:false,timeout:12000,maximumAge:60000});
}
function brLink(b,showName){var d=brDist(b);return '<a class="addr" href="'+esc(mapUrl(b.address))+'" target="_blank" rel="noopener noreferrer">📍 '+(d!==null?esc(fmtDist(d))+' · ':'')+(showName&&b.name?esc(b.name)+' · ':'')+esc(b.address)+'</a>';}

    h+='<div class="near-row"><button type="button" class="btn btn-sm btn-ghost" id="nearBtn" data-act="nearest"></button><span class="sub" id="nearMsg" role="status" aria-live="polite"></span></div>';
    h+='<div class="mappick">'+mapPickHtml()+'</div>';
    h+='<div class="list-head"><span id="qCount"></span><button type="button" class="link" id="qClear" data-act="clearall" hidden>清除搜尋</button></div><ul class="plist" id="listArea"></ul>';
  }
  $('main').innerHTML=h;
  if(!first&&!S.form) refreshList();
  if(S.form) initWheels();
  renderBackup();
}
function renderBackup(){
  var B=S.backup, h;
  if(S.form&&S.places.length){$('backup').innerHTML='';return;}
  h='<div class="backup"><button type="button" class="link" data-act="togglebackup" aria-expanded="'+(B.open?'true':'false')+'">備份與還原 '+(B.open?'▲':'▼')+'</button>';
  if(B.open){
    h+='<p class="sub">換手機、用無痕模式、或從「加到主畫面」打開，都是另一份空的資料，不會自動帶過去。先在有店的那邊按「產生備份碼」，把整段文字傳給自己（例如 WhatsApp），再到新的地方貼上還原。店面和食物照片都不包含在備份碼裡（照片太大，無法放進一段文字）。</p>';
    h+='<button type="button" class="btn btn-sm btn-ghost" data-act="makecode">產生備份碼</button>';
    if(B.code) h+='<textarea class="ta" id="codeOut" rows="4" readonly aria-label="備份碼">'+esc(B.code)+'</textarea>';
    h+='<textarea class="ta" id="restoreText" rows="3" placeholder="在這裡貼上備份碼" aria-label="貼上備份碼">'+esc(B.text)+'</textarea>';
    h+='<button type="button" class="btn btn-sm btn-ghost" data-act="dorestore">還原（只會加入沒有的店，不會覆蓋現有的）</button>';
    if(B.msg) h+='<p class="sub" role="status">'+esc(B.msg)+'</p>';
  }
  $('backup').innerHTML=h+'</div>';
}
function activeFilters(){
  var n=0;['cuisines','kinds','meals','budgets'].forEach(function(g){n+=Object.keys(S.q[g]).filter(function(k){return S.q[g][k];}).length;});
  if(S.q.openNow) n++;
  return n;
}
function fgroup(label,attr,group,keys,names){
  return '<div class="fgroup"><div class="fl">'+label+'</div><div class="chips">'+keys.map(function(k){return chip(attr,k,names[k],S.q[group][k]);}).join('')+'</div></div>';
}
function searchHtml(){
  var n=activeFilters(), h='<div class="search"><div class="search-row"><input class="input" id="qText" type="search" placeholder="搜尋店名或食物" autocomplete="off" value="'+esc(S.q.text)+'">'+
    '<button type="button" class="btn btn-sm btn-ghost" data-act="togglefilter" aria-expanded="'+(S.filtOpen?'true':'false')+'">篩選'+(n?' · '+n:'')+'</button></div>';
  if(S.filtOpen){
    h+='<div class="fgroups">'+fgroup('種類','data-fc','cuisines',CUISINES,CUISINE_ZH)+fgroup('主食','data-fk','kinds',KINDS,KIND_ZH)+
       fgroup('時段','data-fm','meals',MEALS,MEAL_ZH)+fgroup('預算','data-fb','budgets',BUDGETS,BUDGET_ZH)+
       '<div class="fgroup"><div class="fl">營業</div><div class="chips">'+chip('data-fo','1','現在營業中',S.q.openNow)+'</div><p class="sub">只列出有填營業時間的店。</p></div></div>';
  }
  return h+'</div>';
}
function anyOf(map,arr){
  var ks=Object.keys(map).filter(function(k){return map[k];});
  if(!ks.length) return true;
  return arr.some(function(a){return map[a];});
}
function matches(p){
  var q=S.q, t=q.text.trim().toLowerCase();
  if(t&&p.name.toLowerCase().indexOf(t)<0&&!p.dishes.some(function(d){return d.toLowerCase().indexOf(t)>-1;})) return false;
  if(q.openNow&&openNow(p,new Date())!==true) return false;
  return anyOf(q.cuisines,p.cuisines||[])&&anyOf(q.kinds,p.kinds)&&anyOf(q.meals,p.meals)&&anyOf(q.budgets,[p.budget]);
}
function refreshList(){
  var arr=S.places.filter(matches), searching=!!(S.q.text.trim()||activeFilters());
  if(S.near) arr=arr.map(function(p,i){return {p:p,i:i,d:placeDist(p)};}).sort(function(x,y){return (x.d===null)-(y.d===null)||(x.d-y.d)||(x.i-y.i);}).map(function(x){return x.p;});
  $('qClear').hidden=!searching;
  $('qCount').textContent=(searching?'符合 '+arr.length+' / '+S.places.length+' 間':'我的店 · '+S.places.length)+(S.near?' · 由近到遠':'');
  nearUi();
  $('listArea').innerHTML=arr.length?arr.map(rowHtml).join(''):'<li class="empty">沒有符合的店。<button type="button" class="link" data-act="clearall">清除搜尋</button></li>';
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var el=e.target&&e.target.closest?e.target.closest('[data-act],[data-cuisine],[data-kind],[data-meal],[data-budget],[data-map],[data-rmbr],[data-rmdish],[data-del],[data-edit],[data-fc],[data-fk],[data-fm],[data-fb],[data-fo],[data-hm],[data-hd],[data-wi],[data-rmfood]'):null, v, F=S.form, inp;
  if(S.delAsk&&!(el&&el.hasAttribute('data-del'))){S.delAsk=null;render();}
  if(!el) return;
  if(el.hasAttribute('data-del')){
    v=el.getAttribute('data-del');
    if(S.delAsk!==v){S.delAsk=v;render();return;}
    S.delAsk=null; S.places=S.places.filter(function(p){return p.id!==v;});
    save(); if(!S.places.length) S.form=newForm();
    render(); return;
  }
  if(el.hasAttribute('data-rmfood')){
    if(F){F.foods.splice(parseInt(el.getAttribute('data-rmfood'),10),1);$('foodArea').innerHTML=foodAreaHtml();}
    return;
  }
  if(el.hasAttribute('data-wi')){
    el.parentNode.scrollTo({top:parseInt(el.getAttribute('data-wi'),10)*WI,behavior:'smooth'});
    return;
  }
  if(el.hasAttribute('data-rmbr')){
    F.branches.splice(parseInt(el.getAttribute('data-rmbr'),10),1); if(!F.branches.length) F.branches.push({name:'',address:''});
    $('brArea').innerHTML=brAreaHtml(); return;
  }
  if(el.hasAttribute('data-map')){
    S.map=el.getAttribute('data-map');
    try{localStorage.setItem(MAPKEY,S.map);}catch(err){}
    Array.prototype.forEach.call(document.querySelectorAll('.mappick'),function(n){n.innerHTML=mapPickHtml();});
    if($('listArea')) refreshList();
    return;
  }
  if(el.hasAttribute('data-fo')){S.q.openNow=!S.q.openNow;render();return;}
  if(el.hasAttribute('data-hm')){
    if(F){
      F.hoursMode=el.getAttribute('data-hm');
      if(F.hoursMode==='range'){if(!F.open)F.open='08:00';if(!F.close)F.close='20:00';}
      $('hoursArea').innerHTML=hoursAreaHtml(); initWheels();
    }
    return;
  }
  if(el.hasAttribute('data-hd')){
    if(F){v=parseInt(el.getAttribute('data-hd'),10);F.off[v]=!F.off[v];el.setAttribute('aria-pressed',F.off[v]?'true':'false');}
    return;
  }
  if(el.hasAttribute('data-edit')){
    v=el.getAttribute('data-edit');
    S.delAsk=null;
    S.places.forEach(function(p){if(p.id===v) S.form=formFromPlace(p);});
    if(S.form){S.justSaved=false;render();window.scrollTo(0,0);if($('pfName'))$('pfName').focus();}
    return;
  }
  v=el.hasAttribute('data-fc')?'cuisines':el.hasAttribute('data-fk')?'kinds':el.hasAttribute('data-fm')?'meals':el.hasAttribute('data-fb')?'budgets':'';
  if(v){
    inp=el.getAttribute(v==='cuisines'?'data-fc':v==='kinds'?'data-fk':v==='meals'?'data-fm':'data-fb');
    S.q[v][inp]=!S.q[v][inp]; render(); return;
  }
  if(el.hasAttribute('data-act')){
    v=el.getAttribute('data-act');
    if(v==='pickfood'){if($('pfFood'))$('pfFood').click();return;}
    if(v==='pickphoto'){if($('pfPhoto'))$('pfPhoto').click();return;}
    if(v==='rmphoto'&&F){F.photo='';$('photoSlot').innerHTML=photoSlotHtml();return;}
    if(v==='togglebackup'){S.backup.open=!S.backup.open;renderBackup();return;}
    if(v==='makecode'){
      if(!S.places.length){S.backup.code='';S.backup.msg='還沒有店可以備份。';renderBackup();return;}
      S.backup.code=makeCode(); S.backup.msg='請長按下面的文字，全選後複製。'; renderBackup();
      try{navigator.clipboard.writeText(S.backup.code).then(function(){S.backup.msg='已複製備份碼。貼到你要保存的地方。';renderBackup();},function(){});}catch(e){}
      return;
    }
    if(v==='dorestore'){
      inp=importCode($('restoreText')?$('restoreText').value:'');
      if(inp.err){S.backup.msg=inp.err;renderBackup();return;}
      save(); S.backup.text=''; S.backup.code='';
      S.backup.msg='已還原：新增 '+inp.added+' 間'+(inp.skipped?'，略過 '+inp.skipped+' 間（重複或不完整）':'')+'。';
      S.form=null; render(); return;
    }
    if(v==='nearest'){startNearest();return;}
    if(v==='togglefilter'){S.filtOpen=!S.filtOpen;render();return;}
    if(v==='clearall'){S.q={text:'',cuisines:{},kinds:{},meals:{},budgets:{},openNow:false};render();return;}
    if(v==='add'){S.form=newForm();S.justSaved=false;render();if($('pfName'))$('pfName').focus();}
    else if(v==='addbranch'&&F&&F.branches.length<MAX_BRANCHES){
      F.branches.push({name:'',address:''}); $('brArea').innerHTML=brAreaHtml();
      var ins=document.querySelectorAll('[data-bi][data-bf=name]'); if(ins.length) ins[ins.length-1].focus();
    }
    else if(v==='cancel'){S.form=null;render();window.scrollTo(0,0);}
    else if(v==='adddish'&&F){
      inp=$('pfDish'); if(addDish(F,inp.value)){inp.value='';$('dishArea').innerHTML=dishAreaHtml();}
      inp.focus();
    }
    return;
  }
  if(!F) return;
  if(el.hasAttribute('data-cuisine')){
    v=el.getAttribute('data-cuisine'); F.cuisines[v]=!F.cuisines[v];
    el.setAttribute('aria-pressed',F.cuisines[v]?'true':'false'); return;
  }
  if(el.hasAttribute('data-kind')){
    v=el.getAttribute('data-kind'); F.kinds[v]=!F.kinds[v];
    el.setAttribute('aria-pressed',F.kinds[v]?'true':'false');  return;
  }
  if(el.hasAttribute('data-meal')){
    v=el.getAttribute('data-meal'); F.meals[v]=!F.meals[v];
    el.setAttribute('aria-pressed',F.meals[v]?'true':'false'); return;
  }
  if(el.hasAttribute('data-budget')){
    F.budget=el.getAttribute('data-budget');
    Array.prototype.forEach.call(document.querySelectorAll('[data-budget]'),function(b){b.setAttribute('aria-pressed',b.getAttribute('data-budget')===F.budget?'true':'false');});
    return;
  }
  if(el.hasAttribute('data-rmdish')){
    F.dishes.splice(parseInt(el.getAttribute('data-rmdish'),10),1); $('dishArea').innerHTML=dishAreaHtml();  return;
  }
});
function addFoodFiles(files,i,bad){
  var F=S.form, left;
  if(!F) return;
  left=MAX_FOODS-F.foods.length;
  if(i>=files.length||left<=0){
    $('foodArea').innerHTML=foodAreaHtml();
    $('pfErr').textContent=bad?'有 '+bad+' 張照片讀不出來，已略過。':(i<files.length?'最多放 '+MAX_FOODS+' 張，多的沒有加入。':'');
    return;
  }
  readPhoto(files[i],function(url){
    if(!S.form) return;
    if(url) S.form.foods.push(url);
    addFoodFiles(files,i+1,bad+(url?0:1));
  },400,0.65);
}
document.addEventListener('change',function(e){
  var t=e.target, file, files;
  if(t&&t.id==='pfFood'&&S.form){
    files=Array.prototype.slice.call(t.files||[]); t.value='';
    if(files.length) addFoodFiles(files,0,0);
    return;
  }
  if(!t||t.id!=='pfPhoto'||!S.form) return;
  file=t.files&&t.files[0]; t.value='';
  if(!file) return;
  readPhoto(file,function(url){
    if(!S.form) return;
    if(!url){$('pfErr').textContent='這張照片讀不出來，請換一張。';return;}
    S.form.photo=url; $('pfErr').textContent=''; $('photoSlot').innerHTML=photoSlotHtml();
  });
});
document.addEventListener('input',function(e){
  if(S.form&&e.target&&e.target.id==='pfName') S.form.name=e.target.value;
  if(S.form&&e.target&&e.target.getAttribute&&e.target.hasAttribute('data-bi')) {var br=S.form.branches[parseInt(e.target.getAttribute('data-bi'),10)];br[e.target.getAttribute('data-bf')]=e.target.value;if(e.target.getAttribute('data-bf')==='address'){delete br.lat;delete br.lng;delete br.nf;}}
  if(e.target&&e.target.id==='restoreText') S.backup.text=e.target.value;
  if(!S.form&&e.target&&e.target.id==='qText'){S.q.text=e.target.value;refreshList();}
});
document.addEventListener('scroll',function(e){
  var w=e.target;
  if(!w||!w.classList||!w.classList.contains('wheel')) return;
  clearTimeout(w._t); w._t=setTimeout(function(){commitWheel(w);},90);
},true);
document.addEventListener('keydown',function(e){
  var inp, w=e.target, idx;
  if(w&&w.classList&&w.classList.contains('wheel')&&(e.key==='ArrowUp'||e.key==='ArrowDown')){
    e.preventDefault();
    idx=parseInt(w.getAttribute('data-idx'),10)+(e.key==='ArrowDown'?1:-1);
    idx=Math.max(0,Math.min(w.children.length-1,idx));
    w.scrollTo({top:idx*WI}); return;
  }
  if(e.key==='Enter'&&e.target&&e.target.id==='pfDish'&&S.form){
    e.preventDefault(); inp=e.target;
    if(addDish(S.form,inp.value)){inp.value='';$('dishArea').innerHTML=dishAreaHtml();}
  }
});
document.addEventListener('submit',function(e){
  var f=e.target, r, pending, snap;
  if(!f||f.id!=='pform'||!S.form) return;
  e.preventDefault();
  S.form.name=$('pfName').value;
  pending=$('pfDish').value; /* typed but not yet added: add it for the person */
  if(pending.trim()) addDish(S.form,pending);
  snap=JSON.stringify(S.places);
  r=addPlace(S.form);
  if(r.err){
    $('dishArea').innerHTML=dishAreaHtml();  $('pfDish').value='';
    $('pfErr').textContent=r.err; return;
  }
  if(!save()){S.places=JSON.parse(snap);$('pfErr').textContent='手機的儲存空間不足，沒有存成功。請移除一些照片，或刪掉一些舊照片再試。';return;}
  S.form=null; S.justSaved=true; render(); window.scrollTo(0,0);
});

load();
try{if(navigator.storage&&navigator.storage.persist) navigator.storage.persist();}catch(e){}
render();
})();
</script>
